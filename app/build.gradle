plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gametranslator.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gametranslator.ai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'com.alphacephei:vosk-android:0.3.47'
implementation 'com.google.mlkit:translate:17.0.3'
    // OCR (latın əlifbası: ingilis, Azərbaycan, Türk və s.)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Cihazda tərcümə (istəsəniz // işarəsini silin)
    // implementation 'com.google.mlkit:translate:17.0.3'

    // Yapon / Çin / Koreya oyunları üçün (istəsəniz // işarəsini silin)
    // implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    // implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
} 
